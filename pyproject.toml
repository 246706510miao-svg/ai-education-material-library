[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-education-material-library"
version = "0.1.0"
description = "Shared PDF material library with HTTP and MCP access"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.118,<1",
  "httpx>=0.28,<1",
  "mcp>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pymupdf>=1.26,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.37,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
  "testcontainers[postgres]>=4.13,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["material_service", "mcp_server", "frontend_poc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

