- id: system-prompt
  config:
    personaPrefix: !!js >-
      process.getBuiltinModule('node:fs').readFileSync(process.cwd() + '/apps/web/axisverse-presets/axisverse/tutor-prompt.txt', 'utf8')

- insert:
    - id: mcp-axisverse-materials
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: axisverse
        transport: stdio
        command: !!js process.env.AXISVERSE_MCP_PYTHON || 'python'
        args: !!js >-
          ['-B', '-X', 'utf8', '-u', process.cwd() + '/apps/web/axisverse-mcp/server.py',
          '--corpus', process.env.AXISVERSE_MATERIAL_PATH || process.cwd() + '/output/pdf/教材第九章-检索材料.json',
          '--max-results', '5', '--max-query-chars', '200',
          '--plot-output-dir', process.cwd() + '/.dsh/axisverse-diagrams']
        toolCallTimeoutMs: 15000
        failOnStartupError: true
